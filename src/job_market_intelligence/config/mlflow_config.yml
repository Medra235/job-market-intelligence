# MLflow Configuration
experiment_name: "job-category-classification"
tracking_uri: "sqlite:///mlflow.db"

# Data paths
data:
  train_path: "data/processed/train.csv"
  test_path: "data/processed/test.csv"

# Training config
training:
  random_state: 42
  target_col: "job_category"
  cv_folds: 5
  scoring: "f1_macro"

# MLflow Model Registry names
registry:
  logistic_regression: "job-category-logistic-regression"
  random_forest: "job-category-random-forest"

# Model configuration and hyperparameters
models:
  logistic_regression:
    fixed_params:
      max_iter: 5000
      solver: "lbfgs"
      random_state: 42
      class_weight: "balanced"
    param_grid:
      classifier__C: [0.1, 1.0, 3.0, 10.0]

  random_forest:
    fixed_params:
      random_state: 42
      class_weight: "balanced"
    param_grid:
      classifier__n_estimators: [100, 200]
      classifier__max_depth: [20, 40, null]
      classifier__min_samples_split: [2, 5]
