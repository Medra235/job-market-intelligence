# MLflow Configuration
experiment_name: "job-category-classification"
tracking_uri: "sqlite:///mlflow.db"

# Data paths
data:
  train_path: "data/processed/train.csv"
  test_path: "data/processed/test.csv"

# Training config
training:
  random_state: 42
  target_col: "job_category"

# Model parameters
models:
  logistic_regression:
    max_iter: 1000
    C: 1.0
    random_state: 42
    class_weight: "balanced"

  random_forest:
    n_estimators: 100
    max_depth: 20
    min_samples_split: 5
    random_state: 42
    class_weight: "balanced"
