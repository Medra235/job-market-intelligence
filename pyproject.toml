[project]
name = "tfg-market-intelligence"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Data Processing
    "pandas==2.3.3",
    "numpy==2.4.4",
    "pyarrow==23.0.1",

    # Machine Learning
    "scikit-learn==1.8.0",

    # Visualization
    "matplotlib==3.10.8",
    "seaborn==0.13.2",

    # GenAI / RAG
    "langchain==1.2.15",
    "langchain-community==0.4.1",
    "qdrant-client==1.17.1",
    "sentence-transformers==5.4.0",

    # MLOps
    "dvc[s3]==3.67.1",
    "mlflow==3.11.1",

    # Analytics
    "duckdb==1.5.2",

    # API
    "fastapi==0.135.3",
    "uvicorn[standard]==0.44.0",
    "httpx==0.28.1",
    "pydantic==2.13.0",
    "pydantic-settings==2.13.1",

    # Frontend
    "streamlit==1.56.0",
    "plotly==6.7.0",
]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]

lint = [
    "ruff==0.15.10",
]

test = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
]

notebooks = [
    "notebook==7.5.5",
    "ipykernel==7.2.0",
    "nbconvert==7.17.1",
    "nbstripout==0.9.1",
]
